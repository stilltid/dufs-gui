name: Release

# 只支持手动触发（Actions 页面 → Run workflow）。
#
# 为什么去掉了推 tag 自动发版：这个项目只需要借 GitHub 的 runner 编译 +
# 传产物，版本号和发布说明都在弹窗里现填，不依赖 tag，也不怕误推 tag 发错版。
#
# ★ 发布说明在 workflow_dispatch 的弹窗里填。GitHub 至今（2026-09）不给
#   workflow_dispatch 提供多行输入框（只有单行 string），所以**换行要写成字面
#   的 \n**，工作流里会把它还原成真换行。正文支持 Markdown。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，必须与 Cargo.toml 一致（例如 0.2.0）"
        required: true
      release_notes:
        description: '发布说明（支持 Markdown；需要换行时写 \n）'
        required: true
        type: string
      prerelease:
        description: "标记为预发布（Pre-release）"
        type: boolean
        default: true

permissions:
  contents: write # 创建 Release / 上传产物需要

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存
        uses: Swatinem/rust-cache@v2

      # ---- 解析版本号（手动输入）----
      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw "请从 main 分支触发发布（当前 ${{ github.ref }}）" }
          $v = "${{ inputs.version }}".Trim().TrimStart('v', 'V')
          $pre = "${{ inputs.prerelease }}"
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "版本号不合法：$v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v prerelease=$pre"

      # ---- 发布说明：单行输入里用字面 \n 表示换行 ----
      - name: 生成发布说明
        shell: pwsh
        env:
          RAW_NOTES: ${{ inputs.release_notes }}
        run: |
          $notes = ($env:RAW_NOTES -replace '\\n', "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "发布说明不能为空" }
          # 手动写文件：GitHub 的 GITHUB_OUTPUT 多行语法在 Windows 上会被 CRLF 干扰
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\release-notes.md", $notes, [System.Text.UTF8Encoding]::new($false))
          Write-Host "发布说明："
          Get-Content release-notes.md

      # ---- 版本一致性：发错版本会让「检查更新」永远认为有新版本 ----
      - name: 版本号必须与 Cargo.toml 一致
        shell: pwsh
        run: |
          $toml = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $want = "${{ steps.ver.outputs.version }}"
          if ($toml -ne $want) { throw "版本不一致：tag/输入 = $want，Cargo.toml = $toml" }
          Write-Host "Cargo.toml 版本：$toml"

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release
        run: cargo build --release --locked

      # ★ cargo build 不会把图标写进 exe，少了这步发出去的图标是空的
      - name: 嵌入图标
        run: cargo run --release --locked --bin icon_tool -- embed target/release/dufs-gui.exe

      # ---- 内嵌 dufs 的二进制和版本号必须对得上 ----
      - name: 校验内嵌 dufs 版本
        shell: pwsh
        run: |
          $real = (& .\assets\dufs.exe --version).Trim() -replace '^dufs\s+', ''
          $want = (Select-String -Path src\dufs.rs -Pattern 'DUFS_VERSION: &str = "([^"]+)"').Matches[0].Groups[1].Value
          if ($real -ne $want) { throw "内嵌 dufs $real 与 DUFS_VERSION($want) 不一致" }
          Write-Host "内嵌 dufs：$real"

      - name: 生成 SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash target\release\dufs-gui.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  dufs-gui.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            target/release/dufs-gui.exe
            SHA256SUMS.txt
          body_path: release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ inputs.prerelease }}
